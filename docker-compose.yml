version: "3.9"
services:
  backend:
    build: ./backend
    container_name: puiflix_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - /backend/.env

  frontend:
    build: ./frontend
    container_name: puiflix_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
