version: "3.9"
services:
  backend:
    build: ./backend
    container_name: puiflix_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - C:/Users/Mauro/Downloads/movies:/app/movies   # <-- maps host folder to container
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - /backend/.env

  frontend:
    build: ./frontend
    container_name: puiflix_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
